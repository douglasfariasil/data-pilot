[project]
name = "data-pilot"
version = "0.1.0"
description = "Painel de vendas em Python com Streamlit, Plotly e chat com tool calling via OpenRouter."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=3.56.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "ruff>=0.17.5",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.4.0,<0.10.0"]
build-backend = "uv_build"
